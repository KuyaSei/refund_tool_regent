<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Refund Manager{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --brand-bg: #eae6e0;
            --brand-orange: #f7701e;
            --brand-green: #007209;
        }
        body {
            background-color: var(--brand-bg);
            color: #000;
        }
        .navbar {
            background-color: var(--brand-green) !important;
        }
        .btn-brand {
            background-color: var(--brand-orange);
            border-color: var(--brand-orange);
            color: #fff;
        }
        .btn-brand:hover {
            background-color: var(--brand-green);
            border-color: var(--brand-green);
            color: #fff;
        }
        a {
            color: var(--brand-green);
        }
        .btn-outline-secondary.active {
            background-color: var(--brand-green);
            border-color: var(--brand-green);
        }
        .btn-outline-primary {
            color: var(--brand-green);
            border-color: var(--brand-green);
        }
        .btn-outline-primary:hover {
            background-color: var(--brand-green);
            border-color: var(--brand-green);
        }
        .status-pending { background-color: var(--brand-orange) !important; }
        .status-approved { background-color: #0d6efd; }
        .status-rejected { background-color: #dc3545; }
        .status-refunded { background-color: var(--brand-green) !important; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Regent Refund Manager</span>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
